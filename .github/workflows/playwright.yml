name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      ENV: Stg
      EXISTING_USER_NAME: ${{ secrets.EXISTING_USER_NAME }}
      EXISTING_USER_EMAIL: ${{ secrets.EXISTING_USER_EMAIL }}
      EXISTING_USER_PASSWORD: ${{ secrets.EXISTING_USER_PASSWORD }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Typecheck
      run: npm run typecheck
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests (unit, API and e2e)
      run: npx playwright test
    - uses: actions/setup-java@v4
      if: ${{ !cancelled() }}
      with:
        distribution: temurin
        java-version: 17
    - name: Generate Allure Report
      if: ${{ !cancelled() }}
      run: npx allure generate allure-results --clean -o allure-report
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Upload Allure report for GitHub Pages
      if: ${{ !cancelled() && github.event_name == 'push' }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: allure-report/
  deploy:
    # Publishes the Allure report to GitHub Pages only on push to main
    if: ${{ !cancelled() && github.event_name == 'push' }}
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
